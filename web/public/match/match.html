      let preset = null;
      try { preset = JSON.parse(localStorage.getItem("bni-match-host-settings-v1") || "null"); } catch (error) { preset = null; }
      const settings = draftSettings || {
        groupSize: plan && plan.groupSize ? plan.groupSize : (preset && preset.groupSize ? preset.groupSize : 4),
        rounds: plan && plan.roundsRequested ? plan.roundsRequested : (preset && preset.rounds ? preset.rounds : 3)
      };
      paint(`${statusHtml()}<div class="host-top">${rosterHtml(roster)}${settingsHtml(roster, settings, plan, stale)}</div>${plan ? resultHtml(plan, roster, stale) : ""}`, "掃碼只在現場的手機之間傳。結果碼給會員用相機打開，手機會留下他每一輪的組別。", `主持名單 ${roster.length} 人。`);
    }

    function rosterHtml(roster) {
      const people = roster.map(function (person) {
        const editing = editId === person.id;
        const body = editing
          ? `<form data-action="save-edit">${field("name", "姓名", person.name, { required: true, max: 20 })}${chapterField(person.chapter)}${roleField(person.role)}${field("company", "公司", person.company, { max: 40 })}${field("industry", "行業別", person.industry, { max: 20 })}${chainField(person.chain)}${field("have", "我有的資源", person.have, { area: true })}${field("want", "想要的資源", person.want, { area: true })}<div class="actions"><button class="primary" type="submit">儲存</button><button class="secondary" type="button" data-action="cancel-edit">取消</button></div></form>`
          : `<p class="meta">${esc(roleLine(person) || "未填公司與行業")}</p><p class="hint">有的：${esc(person.have || "未填")}</p><p class="hint">想要：${esc(person.want || "未填")}</p><div class="row-actions"><button class="text-btn" type="button" data-action="edit" data-id="${esc(person.id)}">編輯</button><button class="danger" type="button" data-action="remove" data-id="${esc(person.id)}" ${pendingRemove === person.id ? 'aria-pressed="true"' : ""}>${pendingRemove === person.id ? "確定移除" : "移除"}</button></div>`;
        return `<article class="person"><div class="person-top"><h3>${esc(person.name)}${person.role ? `<span class="tag is-role">${esc(person.role)}</span>` : ""}${person.chapter ? "" : '<span class="tag">未選分會</span>'}${person.chain ? "" : '<span class="tag">未選產業鏈</span>'}${person.want ? "" : '<span class="tag">未填想要</span>'}</h3></div>${body}</article>`;
      }).join("");
      const chapter = showChapter ? `<div class="stack"><label class="field">搜尋分會名單<input id="chapter-filter" placeholder="姓名、公司或行業"></label><form data-action="add-chapter">${CHAPTER.map(function (row, index) {
        const here = roster.some(function (person) { return person.name === row[0]; });
        return `<label class="check${here ? " is-in" : ""}" data-chapter="${esc(row.join(" "))}"><input type="checkbox" name="m" value="${index}" ${here ? "disabled" : ""}><span><strong>${esc(row[0])}</strong>${here ? " 已在名單" : ""}<span class="meta">${esc(row[2])}${row[1] ? " · " + esc(row[1]) : ""}</span></span></label>`;
      }).join("")}<div class="actions"><button class="secondary" type="button" data-action="check-chapter">全選尚未加入的人</button><button class="primary" type="submit">加入勾選的人</button></div></form></div>` : "";
      const manual = showManual ? `<form data-action="add-manual">${field("name", "姓名", "", { required: true, max: 20 })}${chapterField("")}${roleField("")}${field("company", "公司", "", { max: 40 })}${field("industry", "行業別", "", { max: 20 })}${chainField("")}${field("have", "我有的資源", "", { area: true })}${field("want", "想要的資源", "", { area: true })}<button class="primary" type="submit">加入名單</button></form>` : "";
      const paste = showPaste ? `<form data-action="paste-code"><label class="field">資料碼或回饋碼<input name="code" placeholder="貼上會員資料碼或引薦回饋碼"></label><button class="primary" type="submit">收下</button></form>` : "";
      return `<section class="panel"><p class="kicker">出席名單</p><h2>${roster.length} 人</h2><div class="actions"><button class="secondary" type="button" data-action="toggle" data-flag="showPaste" aria-pressed="${showPaste}">貼上資料碼</button><button class="secondary" type="button" data-action="toggle" data-flag="showManual" aria-pressed="${showManual}">手動加一位</button><button class="secondary" type="button" data-action="toggle" data-flag="showChapter" aria-pressed="${showChapter}">從分會名單勾選</button></div>${paste}${manual}${chapter}<div class="roster">${people || `<p class="hint">還沒有人。請會員打開「登錄我的資料」，再把資料碼給你掃。</p>`}</div>${roster.length ? `<button class="danger" type="button" data-action="clear" ${pendingClear ? 'aria-pressed="true"' : ""}>${pendingClear ? "確定清空名單" : "清空名單"}</button>` : ""}</section>`;
    }

    function settingsHtml(roster, settings, plan, stale) {
      const need = roster.filter(function (person) { return !person.want; }).length;
      const matchLabel = pendingMatch ? "確定重排，已掃過的碼要重掃" : (plan ? "重新媒合" : "開始媒合");
      return `<section class="panel"><p class="kicker">官方媒合</p><h2>人數與輪數</h2><ol class="steps"><li>會員用自己的手機登錄，把資料碼給你掃。</li><li>主持頁請用 Safari 或 Chrome 打開。用同一支手機的相機掃，掃完回到這一頁。</li><li>設定每組人數和輪數，開始媒合。</li><li>先投影給全場。想把組別留在手機裡的人，再掃自己的結果碼。</li></ol><form data-action="match"><label class="field">每組人數<input id="group-size" name="groupSize" type="number" min="2" max="6" value="${settings.groupSize}"></label><label class="field">輪數<input id="round-count" name="rounds" type="number" min="1" max="4" value="${settings.rounds}"></label><p class="hint">分組會讓「想要的」對上別人「有的」，同產業鏈的人會優先排在一起，同一組盡量混合不同分會、不同行業，領導幹部會分散到各組當組長，下一輪盡量換人。輪數最多 4，結果碼才掃得開。</p>${need ? `<p class="hint">還有 ${need} 人沒填想要的資源，這些人會依行業錯開來排。</p>` : ""}<button class="primary" type="submit" ${roster.length < 2 ? "disabled" : ""}>${matchLabel}</button></form>${stale ? `<p class="callout">名單或資源已改過。請重新媒合，再讓會員重掃結果碼。</p>` : ""}</section>`;
    }

    function resultHtml(plan, roster, stale) {
      if (showRound < 0 || showRound >= plan.roundGroups.length) showRound = 0;
      const byId = new Map(roster.map(function (person) { return [person.id, person]; }));
      const summary = summaryText(plan);
      if (hostPanel === "phone") {
        const people = visiblePeople(plan, roster);
        if (!people.length) return `<section class="panel" id="result-anchor"><h2>沒有可以投放的人</h2></section>`;
        if (phoneIndex >= people.length) phoneIndex = 0;
        const person = people[phoneIndex];
        const card = plan.cards[person.id];
        if (!card) return `<section class="panel" id="result-anchor"><h2>這個人的組別遺失</h2><p>請重新媒合。</p></section>`;
        const url = resultUrl(card);
        urlById[person.id] = url;
        let svg = "";
        let qrError = "";
        try { svg = qrSvg(url); } catch (error) { qrError = "這張碼太長，請改小每組人數或輪數後重新媒合。"; }
        return `<section class="panel phone-card" id="result-anchor"><p class="kicker">投到會員手機</p><h2>${esc(person.name)}</h2><label class="field">換一位<select id="phone-person">${people.map(function (item, index) { return `<option value="${index}" ${index === phoneIndex ? "selected" : ""}>${esc(item.name)}</option>`; }).join("")}</select></label>${svg ? `<div class="qr">${svg}</div>` : `<p class="callout">${esc(qrError)}</p>`}<p>請 ${esc(person.name)} 用相機掃描自己的名字。打開後看得到每一輪的組別。</p>${url.length > 1500 ? `<p class="hint">這張碼比較密，請把螢幕調亮再掃。</p>` : ""}<p class="url">${esc(url)}</p><div class="actions"><button class="secondary" type="button" data-action="person-step" data-step="-1">上一位</button><button class="secondary" type="button" data-action="person-step" data-step="1">下一位</button><button class="secondary" type="button" data-action="copy" data-id="${esc(person.id)}">複製連結</button><button class="text-btn" type="button" data-action="preview" data-id="${esc(person.id)}">預覽他的畫面</button></div><div class="actions"><button class="text-btn" type="button" data-action="panel" data-panel="board">回到分組表</button></div></section>`;
      }
      const round = plan.roundGroups[Math.min(showRound, plan.roundGroups.length - 1)] || [];
      const leaders = leadersOf(plan, roster)[showRound] || [];
      const cards = round.map(function (ids, index) {
        const members = ids.map(function (id) { return byId.get(id); }).filter(Boolean);
        const color = COLORS[index % COLORS.length];
        const hint = (plan.highlights[showRound] || [])[index] || "";
        const picker = `<label class="leader-pick">組長<select data-leader-round="${showRound}" data-leader-group="${index}">${members.map(function (person) { return `<option value="${esc(person.id)}" ${person.id === leaders[index] ? "selected" : ""}>${esc(person.name)}${person.role ? "（" + esc(person.role) + "）" : ""}</option>`; }).join("")}</select></label>`;
        return `<article class="group-card" style="--swatch:${color}"><h3>第 ${index + 1} 組</h3><ul>${members.map(function (person) { return `<li><strong>${esc(person.name)}${person.id === leaders[index] ? '<span class="tag is-leader">組長</span>' : ""}${person.role ? `<span class="tag is-role">${esc(person.role)}</span>` : ""}</strong><span>${esc(roleLine(person))}</span></li>`; }).join("")}</ul>${picker}<p class="hint">${esc(hint)}</p></article>`;
      }).join("");
      const manualLeaders = Boolean(plan.leaderManual);
      return `<section class="panel" id="result-anchor"><p class="kicker">分組結果${plan.at ? " · " + esc(clock(plan.at)) : ""}</p><h2>第 ${showRound + 1} 輪</h2><p>${esc(summary)}</p><div class="actions"><button class="secondary" type="button" data-action="panel" data-panel="project">投影這一輪</button><button class="primary" type="button" data-action="panel" data-panel="phone" ${stale ? "disabled" : ""}>給會員掃結果碼</button></div>${stale ? `<p class="hint">名單已改過，結果碼先關掉。重新媒合後再投放。</p>` : ""}<p class="hint">組長先自動指派：優先由領導幹部擔任，同一人盡量不連續當。可以在每組下方改人。${manualLeaders ? `已手動改過組長，已掃過結果碼的人要重掃才會看到新的組長。 <button class="text-btn" type="button" data-action="reset-leaders">組長改回自動</button>` : ""}</p><div class="actions"><button class="secondary" type="button" data-action="panel" data-panel="stats">人脈統計</button></div><div class="round-switch">${plan.roundGroups.map(function (_, index) { return `<button type="button" data-action="set-round" data-round="${index}" aria-pressed="${index === showRound}">第 ${index + 1} 輪</button>`; }).join("")}</div></section><div class="board">${cards}</div>`;
    }

    function rankListHtml(rows, emptyText) {
      if (!rows.length) return `<p class="hint">${esc(emptyText)}</p>`;
      return `<ol class="rank-list">${rows.slice(0, 10).map(function (row, index) {
        return `<li><span><span class="place">${index + 1}.</span>${esc(row.name)}</span><span class="score">${row.count}</span></li>`;
      }).join("")}</ol>`;
    }

    function statsHtml(plan, roster) {
      const store = loadHostFeedback();
      const roundCount = plan ? plan.roundGroups.length : 0;
      if (statsRound !== "all") {
        const n = Number(statsRound);
        if (!Number.isInteger(n) || n < 1 || n > Math.max(1, roundCount)) statsRound = "all";
      }
      const edges = store.edges.filter(function (edge) {
        return statsRound === "all" || Number(edge.round) === Number(statsRound);
      });
      const network = Match.rankReferrals(edges, "network");
      const business = Match.rankReferrals(edges, "business");
      const total = Match.rankReferrals(edges, "");
      const king = total[0];
      const people = visiblePeople(plan, roster);
      const names = (people.length ? people : roster).map(function (person) { return person.name; });
      const roundOptions = [`<option value="all"${statsRound === "all" ? " selected" : ""}>全部輪次</option>`]
        .concat(Array.from({ length: roundCount }, function (_, index) {
          const value = String(index + 1);
          return `<option value="${value}"${String(statsRound) === value ? " selected" : ""}>第 ${value} 輪</option>`;
        }));
      const nameOptions = names.map(function (name) {
        return `<option value="${esc(name)}">${esc(name)}</option>`;
      }).join("");
      const manual = names.length >= 2 ? `<form data-action="add-feedback"><h3>手動補一筆</h3><label class="field">輪次<select name="round">${Array.from({ length: Math.max(1, roundCount) }, function (_, index) { return `<option value="${index + 1}">第 ${index + 1} 輪</option>`; }).join("")}</select></label><label class="field">提供者<select name="giver" required><option value="">請選擇</option>${nameOptions}</select></label><label class="field">對象<select name="receiver" required><option value="">請選擇</option>${nameOptions}</select></label><div class="feedback-flags"><label><input type="checkbox" name="network" value="1" checked>人脈引薦</label><label><input type="checkbox" name="business" value="1">商機引薦</label></div><button class="primary" type="submit">加入紀錄</button></form>` : `<p class="hint">名單至少兩人，才能手動補引薦。</p>`;
      const awardBtn = king
        ? `<button class="primary" type="button" data-action="panel" data-panel="award">人脈王頒獎</button>`
        : `<button class="primary" type="button" disabled>人脈王頒獎</button>`;
      return `<section class="panel"><p class="kicker">現場統計</p><h2>人脈王</h2><p>${king ? `${esc(king.name)} 目前 ${king.count} 筆引薦（人脈＋商機）。` : "還沒有引薦紀錄。請會員在組別頁勾選後產生回饋碼給你掃。"}</p><p class="hint">已收回饋 ${store.reporters.length}${roster.length ? " / " + roster.length : ""} 人 · 引薦紀錄 ${edges.length} 筆</p><label class="field">統計範圍<select id="stats-round">${roundOptions.join("")}</select></label><div class="actions">${awardBtn}<button class="secondary" type="button" data-action="panel" data-panel="board">回到分組表</button><button class="text-btn" type="button" data-action="clear-feedback">清空引薦統計</button></div></section><div class="split"><section class="panel"><h2>人脈王榜</h2><p class="hint">人脈引薦提供次數</p>${rankListHtml(network, "尚無人脈引薦")}</section><section class="panel"><h2>商機王榜</h2><p class="hint">商機引薦提供次數</p>${rankListHtml(business, "尚無商機引薦")}</section><section class="panel"><h2>總引薦榜</h2><p class="hint">人脈＋商機合計</p>${rankListHtml(total, "尚無紀錄")}</section><section class="panel">${manual}<p class="hint">同一輪、同一對人、同一類型只會算一次，雙方都勾也不會重複。</p></section></div>`;
    }

    function personLookup(roster) {
      const map = new Map();
      (roster || []).forEach(function (person) { map.set(person.name, person); });
      return map;
    }

    function awardMeta(person) {
      if (!person) return "";
      return [knownChapter(person.chapter), person.industry, person.company].filter(Boolean).join(" · ");
    }

    function awardPlaceHtml(row, place, byName) {
      if (!row) return `<article class="award-place place-${place}"><span class="medal">第 ${place} 名</span><p class="name">從缺</p><p class="meta-line">本場尚無紀錄</p></article>`;
      const person = byName.get(row.name);
      const meta = awardMeta(person);
      return `<article class="award-place place-${place}"><span class="medal">第 ${place} 名</span><p class="name">${esc(row.name)}</p>${meta ? `<p class="meta-line">${esc(meta)}</p>` : ""}<p class="count">${row.count} 筆引薦</p></article>`;
    }

    function awardConfettiHtml() {
      const colors = ["#7a2e2e", "#c46a2f", "#2c5f8a", "#2f7d55", "#b08d57", "#8c3d4a"];
      let html = "";
      for (let i = 0; i < 28; i += 1) {
        const left = 4 + (i * 37) % 92;
        const delay = (0.8 + (i % 9) * 0.22 + (i % 5) * 0.07).toFixed(2);
        const drift = ((i % 2 ? 1 : -1) * (12 + (i % 7) * 8)) + "px";
        const bit = colors[i % colors.length];
        html += `<i style="left:${left}%;--delay:${delay}s;--drift:${drift};--bit:${bit}"></i>`;
      }
      return `<div class="award-confetti" aria-hidden="true">${html}</div>`;
    }

    function awardHtml(plan, roster) {
      const store = loadHostFeedback();
      const roundCount = plan ? plan.roundGroups.length : 0;
      if (statsRound !== "all") {
        const n = Number(statsRound);
        if (!Number.isInteger(n) || n < 1 || n > Math.max(1, roundCount)) statsRound = "all";
      }
      const edges = store.edges.filter(function (edge) {
        return statsRound === "all" || Number(edge.round) === Number(statsRound);
      });
      const total = Match.rankReferrals(edges, "");
      const network = Match.rankReferrals(edges, "network");
      const business = Match.rankReferrals(edges, "business");
      const byName = personLookup(roster);
      const scope = statsRound === "all" ? "全部輪次" : `第 ${statsRound} 輪`;
      const controls = `<div class="award-controls"><button class="primary" type="button" data-action="replay-award">再播一次</button><button class="secondary" type="button" data-action="panel" data-panel="stats">回到人脈統計</button><button class="text-btn" type="button" data-action="panel" data-panel="board">回到分組表</button></div>`;
      if (!total.length) {
        return `<section class="award-stage"><div class="award-card"><p class="kicker">現場頒獎</p><h2 class="award-title">人脈王</h2><p class="award-empty">還沒有引薦紀錄，先收回饋碼再頒獎。</p></div>${controls}</section>`;
      }
      const side = `<div class="award-side"><div class="chip-card"><span>人脈引薦王</span><strong>${network[0] ? esc(network[0].name) : "從缺"}</strong><span>${network[0] ? network[0].count + " 筆人脈引薦" : "尚無紀錄"}</span></div><div class="chip-card"><span>商機引薦王</span><strong>${business[0] ? esc(business[0].name) : "從缺"}</strong><span>${business[0] ? business[0].count + " 筆商機引薦" : "尚無紀錄"}</span></div></div>`;
      return `<section class="award-stage">${awardConfettiHtml()}<div class="award-card"><p class="kicker">現場頒獎 · ${esc(scope)}</p><h2 class="award-title">本場人脈王</h2><p class="award-sub">依人脈＋商機引薦合計，先揭曉第三名、第二名，最後是人脈王。</p><div class="award-podium">${awardPlaceHtml(total[2], 3, byName)}${awardPlaceHtml(total[1], 2, byName)}${awardPlaceHtml(total[0], 1, byName)}</div>${side}</div>${controls}</section>`;
    }

    function summaryText(plan) {
      const sizeText = plan.sizes.every(function (size) { return size === plan.sizes[0]; })
        ? `每組 ${plan.sizes[0]} 人`
        : `各組人數 ${plan.sizes.join("、")}`;
      const linked = plan.linked.map(function (count, index) { return `第 ${index + 1} 輪 ${count} 組對得上資源`; }).join("，");
      const repeat = plan.repeatPairs
        ? `不同輪再次同組 ${plan.repeatPairs} 對${plan.repeats.length ? "：" + plan.repeats.slice(0, 4).join("、") : ""}`
        : "每一輪都換到新的人";
      const extra = [];
      const roster = loadRoster();
      const cadres = new Set(roster.filter(function (person) { return person.role; }).map(function (person) { return person.id; }));
      if (cadres.size) {
        extra.push((plan.leaders || []).map(function (round, index) {
          return `第 ${index + 1} 輪 ${round.filter(function (id) { return cadres.has(id); }).length}/${round.length} 組由幹部當組長`;
        }).join("，"));
      }
      if (plan.singleGroup) extra.push("人數只夠一組，所以只排 1 輪");
      if (plan.oversized) extra.push("有一組比設定多 1 人，這樣才不會有人落單");
      return [sizeText, linked, repeat].concat(extra).filter(Boolean).join("。") + "。";
    }

    function projectHtml(plan, roster) {
      if (showRound < 0 || showRound >= plan.roundGroups.length) showRound = 0;
      const byId = new Map(roster.map(function (person) { return [person.id, person]; }));
      const round = plan.roundGroups[showRound] || [];
      const leaders = leadersOf(plan, roster)[showRound] || [];
      const cards = round.map(function (ids, index) {
        const members = ids.map(function (id) { return byId.get(id); }).filter(Boolean);
        return `<article class="group-card" style="--swatch:${COLORS[index % COLORS.length]}"><h3>第 ${index + 1} 組</h3><ul>${members.map(function (person) { return `<li><strong>${esc(person.name)}${person.id === leaders[index] ? '<span class="tag is-leader">組長</span>' : ""}</strong><span>${esc([knownChapter(person.chapter), person.industry].filter(Boolean).join(" · "))}</span></li>`; }).join("")}</ul></article>`;
      }).join("");
      return `<p class="kicker">第 ${showRound + 1} 輪，共 ${plan.roundGroups.length} 輪。組號就是桌號。</p><div class="board">${cards}</div><div class="round-switch"><button type="button" data-action="round-step" data-step="-1">上一輪</button>${plan.roundGroups.map(function (_, index) { return `<button type="button" data-action="set-round" data-round="${index}" aria-pressed="${index === showRound}">第 ${index + 1} 輪</button>`; }).join("")}<button type="button" data-action="round-step" data-step="1">下一輪</button><button type="button" data-action="panel" data-panel="board">離開投影</button></div>`;
    }

    function renderPersonal(payload, preview) {
      let card;
      try { card = Match.decodePersonal(decodeURIComponent(payload)); }
      catch (error) {
        try { card = Match.decodePersonal(payload); }
        catch (again) { card = null; }
      }
      if (!card) {
        document.body.classList.add("focus-result");
        paint(`<section class="panel"><h2>這張組別讀不起來</h2><p>請主持再出示一次你的結果碼。</p><button class="primary" type="button" data-action="go" data-hash="">回到首頁</button></section>`, "", "組別無法讀取。");
        return;
      }
      if (!preview) localStorage.setItem(STORE.card, JSON.stringify(card));
      document.body.classList.add("focus-result");
      document.body.classList.remove("projecting", "awarding");
      paint(personalHtml(card, false), "組別存在這支手機。主持宣布下一輪時，點對應的輪次。", `${card.name} 的組別`);
    }

    function personalHtml(card, preview) {
      if (showRound < 0 || showRound >= card.rounds.length) showRound = 0;
      const index = Math.min(showRound, card.rounds.length - 1);
      const round = card.rounds[index];
      const color = COLORS[(round.group - 1) % COLORS.length];
      const mates = round.mates.map(function (mate) {
        return `<li><strong>${esc(mate.name)}${round.leader && mate.name === round.leader ? '<span class="tag is-leader">組長</span>' : ""}</strong><span>${esc([chapterLabel(mate.chapter), mate.industry, mate.chain, mate.company].filter(Boolean).join(" · "))}</span></li>`;
      }).join("");
      const me = loadMe();
      const warn = !preview && me && me.name !== card.name ? `<p class="callout">這張卡是 ${esc(card.name)}。若不是你，請掃自己的名字。</p>` : "";
      const saved = preview ? {} : loadRoundFeedback(card.name, index);
      const feedback = !preview && round.mates.length ? `<div class="feedback-block"><h2>這一輪的引薦回饋</h2><p class="hint">對同組的人勾選即可，可複選。填完再產生回饋碼給主持掃。</p>${round.mates.map(function (mate) {
        const row = saved[mate.name] || {};
        return `<div class="feedback-mate" data-mate="${esc(mate.name)}"><strong>${esc(mate.name)}</strong><div class="feedback-flags"><label><input type="checkbox" data-fb="giveNetwork" data-card="${esc(card.name)}" data-round="${index}" data-mate="${esc(mate.name)}"${row.giveNetwork ? " checked" : ""}>我有提供人脈引薦</label><label><input type="checkbox" data-fb="recvNetwork" data-card="${esc(card.name)}" data-round="${index}" data-mate="${esc(mate.name)}"${row.recvNetwork ? " checked" : ""}>我有收到人脈引薦</label><label><input type="checkbox" data-fb="giveBusiness" data-card="${esc(card.name)}" data-round="${index}" data-mate="${esc(mate.name)}"${row.giveBusiness ? " checked" : ""}>我有提供商機引薦</label><label><input type="checkbox" data-fb="recvBusiness" data-card="${esc(card.name)}" data-round="${index}" data-mate="${esc(mate.name)}"${row.recvBusiness ? " checked" : ""}>我有收到商機引薦</label></div></div>`;
      }).join("")}</div>` : "";
      let feedbackQr = "";
      if (!preview && showFeedbackQr) {
        try {
          const report = collectMemberFeedbackReport(card);
          const url = absHash("#f=" + Match.encodeFeedback(report));
          urlById.feedback = url;
          let svg = "";
          try { svg = qrSvg(url); } catch (error) { svg = ""; }
          feedbackQr = `<section class="panel phone-card" style="margin-top:12px"><p class="kicker">給主持掃</p><h2>引薦回饋碼</h2><p>${esc(card.name)} 已勾 ${report.entries.length} 筆對象。</p>${svg ? `<div class="qr">${svg}</div>` : ""}<p class="url">${esc(url)}</p><button class="secondary" type="button" data-action="copy" data-id="feedback">複製連結</button></section>`;
        } catch (error) {
          feedbackQr = `<p class="callout" role="status">${esc(error.message || "還無法產生回饋碼")}</p>`;
          showFeedbackQr = false;
        }
      }
      const memberActions = preview
        ? `<button class="text-btn" type="button" data-action="panel" data-panel="phone">返回主持</button>`
        : `<div class="actions"><button class="primary" type="button" data-action="make-feedback">產生回饋碼</button><button class="text-btn" type="button" data-action="go" data-hash="">回到首頁</button><button class="text-btn" type="button" data-action="clear-card">這不是我的組別</button></div>${feedbackQr}`;
      return `<section class="ticket" style="--swatch:${color}">${warn}<p class="me-name">${esc(card.name)}</p><p class="kicker">第 ${index + 1} 輪，共 ${card.rounds.length} 輪</p><p class="group-no">第 ${round.group} 組</p><p class="walk">走到第 ${round.group} 桌</p>${round.leader ? `<p class="leader-line${round.leader === card.name ? " is-me" : ""}">${round.leader === card.name ? "這一輪你是組長，請帶大家自我介紹、交換需求。" : "組長：" + esc(round.leader)}</p>` : ""}<div class="why">${esc(round.why || "這一輪先認識同組的人")}</div><h2>同組</h2><ul class="mates">${mates || "<li>這一輪沒有其他組員</li>"}</ul>${feedback}<div class="round-switch">${card.rounds.map(function (item, roundIndex) { return `<button type="button" data-action="set-round" data-round="${roundIndex}" aria-pressed="${roundIndex === index}">第 ${roundIndex + 1} 輪</button>`; }).join("")}</div>${memberActions}</section>`;
    }

    function clamp(value, min, max, fallback) {
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, Math.round(value)));
    }

    function readSettings() {
      const groupInput = document.querySelector("#group-size");
      const roundInput = document.querySelector("#round-count");
      return {
        groupSize: clamp(Number(groupInput && groupInput.value), 2, 6, 4),
        rounds: clamp(Number(roundInput && roundInput.value), 1, 4, 3)
      };
    }

    function runMatch() {
      const roster = loadRoster();
      if (roster.length < 2) {
        statusMessage = "至少要兩個人才能分組";
        render();
        return;
      }
      const settings = readSettings();
      try {
        const result = Match.planMeeting(roster, settings.groupSize, settings.rounds, Date.now() >>> 0);
        result.fingerprint = fingerprint(roster);
        result.groupSize = settings.groupSize;
        result.roundsRequested = settings.rounds;
        result.at = Date.now();
        savePlan(result);
        hostPanel = "board";
        showRound = 0;
        phoneIndex = 0;
        statusMessage = result.singleGroup ? "人數只夠一組，已排成 1 輪。" : "分組完成。可以投影，或把結果碼給會員掃。";
      } catch (error) {
        statusMessage = error.message || "無法分組";
      }
      render();
      const anchor = document.querySelector("#result-anchor");
      if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderFeedbackIngest(payload) {
      document.body.classList.remove("projecting", "awarding", "focus-result");
      let report;
      try { report = Match.decodeFeedback(decodeURIComponent(payload)); }
      catch (error) {
        try { report = Match.decodeFeedback(payload); }
        catch (again) { report = null; }
      }
      if (!report) {
        paint(`<section class="panel"><h2>這張回饋碼讀不起來</h2><p>請會員重新出示回饋碼。</p><button class="primary" type="button" data-action="go" data-hash="#host">回到主持</button></section>`, "", "回饋碼無法讀取。");
        return;
      }
      const result = ingestHostFeedback(report);
      hostPanel = "stats";
      paint(`<section class="panel"><p class="kicker">已收下回饋</p><h2>${esc(result.reporter)}</h2><p>這次讀到 ${result.edges} 筆勾選，名單裡新增 ${result.added} 筆引薦紀錄。</p><p>目前共 ${result.reporters} 人交過回饋碼，引薦紀錄 ${result.total} 筆。</p><div class="actions"><button class="primary" type="button" data-action="go-stats">看人脈統計</button><button class="secondary" type="button" data-action="go" data-hash="#host">回到主持</button></div></section>`, "請繼續掃下一位，或打開人脈統計。", "回饋已進人脈統計。");
    }

    function render() {
      const hash = location.hash || "";
      if (hash.startsWith("#j=")) return renderIngest(hash.slice(3));
      if (hash.startsWith("#f=")) return renderFeedbackIngest(hash.slice(3));
      if (hash.startsWith("#p=")) return renderPersonal(hash.slice(3), false);
      if (hash.startsWith("#member")) return renderMember();
      if (hash.startsWith("#host")) return renderHost();
      renderHome();
    }

    document.querySelector("#app").addEventListener("click", function (event) {
      const btn = event.target.closest("[data-action]");
      if (!btn || btn.disabled) return;
      const action = btn.dataset.action;
      if (action === "go") {
        go(btn.dataset.hash || "");
        return;
      }
      if (action === "go-stats") {
        hostPanel = "stats";
        go("#host");
        return;
      }
      if (action === "copy") {
        const url = urlById[btn.dataset.id] || "";
        if (!navigator.clipboard || !navigator.clipboard.writeText) {
          statusMessage = "無法複製，請長按下面的連結";
          render();
          return;
        }
        navigator.clipboard.writeText(url).then(function () {
          statusMessage = "連結已複製";
          render();
        }, function () {
          statusMessage = "無法複製，請長按下面的連結";
          render();
        });
        return;
      }
      if (action === "open-card") {
        const card = loadJson(STORE.card, null);
        if (!card || !card.rounds || !card.rounds.length) return;
        showRound = 0;
        go("#p=" + Match.encodePersonal(card, Boolean(card.rounds.some(function (round) {
          return round.mates.some(function (mate) { return mate.company; });
        }))));
        return;
      }
      if (action === "clear-card") {
        localStorage.removeItem(STORE.card);
        showFeedbackQr = false;
        showRound = 0;
        go("");
        return;
      }
      if (action === "make-feedback") {
        showFeedbackQr = true;
        render();
        const box = document.querySelector(".phone-card");
        if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      if (action === "clear-feedback") {
        saveHostFeedback({ edges: [], reporters: [] });
        statusMessage = "引薦統計已清空";
        render();
        return;
      }
      if (action === "toggle") {
        if (btn.dataset.flag === "showChapter") showChapter = !showChapter;
        if (btn.dataset.flag === "showManual") showManual = !showManual;
        if (btn.dataset.flag === "showPaste") showPaste = !showPaste;
        render();
        return;
      }
      if (action === "check-chapter") {
        document.querySelectorAll(".check input:not(:disabled)").forEach(function (input) { input.checked = true; });
        return;
      }
      if (action === "edit") {
        editId = btn.dataset.id;
        pendingRemove = "";
        render();
        return;
      }
      if (action === "cancel-edit") {
        editId = "";
        render();
        return;
      }
      if (action === "remove") {
        if (pendingRemove !== btn.dataset.id) {
          pendingRemove = btn.dataset.id;
          render();
          return;
        }
        saveRoster(loadRoster().filter(function (person) { return person.id !== btn.dataset.id; }));
        pendingRemove = "";
        editId = "";
        render();
        return;
      }
      if (action === "clear") {
        if (!pendingClear) {
          pendingClear = true;
          render();
          return;
        }
        saveRoster([]);
        localStorage.removeItem(STORE.plan);
        saveHostFeedback({ edges: [], reporters: [] });
        pendingClear = false;
        hostPanel = "setup";
        render();
        return;
      }
      if (action === "panel") {
        hostPanel = btn.dataset.panel || "setup";
        pendingMatch = false;
        render();
        return;
      }
      if (action === "replay-award") {
        hostPanel = "award";
        const stage = document.querySelector(".award-stage");
        if (stage) {
          const clone = stage.cloneNode(true);
          stage.parentNode.replaceChild(clone, stage);
        } else {
          render();
        }
        return;
      }
      if (action === "preview") {
        previewId = btn.dataset.id;
        const people = visiblePeople(loadPlan(), loadRoster());
        const index = people.findIndex(function (person) { return person.id === previewId; });
        if (index >= 0) phoneIndex = index;
        hostPanel = "preview";
        render();
        return;
      }
      if (action === "reset-leaders") {
        const plan = loadPlan();
        if (!plan) return;
        plan.leaders = Match.autoLeaders(plan.roundGroups, loadRoster());
        plan.leaderManual = false;
        Match.syncLeaders(plan);
        savePlan(plan);
        statusMessage = "組長已改回自動指派。";
        render();
        return;
      }
      if (action === "set-round") {
        showRound = Number(btn.dataset.round) || 0;
        showFeedbackQr = false;
        render();
        return;
      }
      if (action === "round-step") {
        const plan = loadPlan();
        const count = plan ? plan.roundGroups.length : 1;
        showRound = (showRound + Number(btn.dataset.step) + count) % count;
        render();
        return;
      }
      if (action === "person-step") {
        const count = visiblePeople(loadPlan(), loadRoster()).length || 1;
        phoneIndex = (phoneIndex + Number(btn.dataset.step) + count) % count;
        render();
        return;
      }
    });

    document.querySelector("#app").addEventListener("change", function (event) {
      if (event.target.id === "phone-person") {
        phoneIndex = Number(event.target.value) || 0;
        render();
        return;
      }
      if (event.target.id === "stats-round") {
        statsRound = event.target.value || "all";
        render();
        return;
      }
      if (event.target.dataset.fb) {
        const name = event.target.dataset.card;
        const roundIndex = Number(event.target.dataset.round);
        const mate = event.target.dataset.mate;
        const fieldName = event.target.dataset.fb;
        if (!name || !mate || !Number.isInteger(roundIndex)) return;
        const saved = loadRoundFeedback(name, roundIndex);
        const row = Object.assign({
          giveNetwork: false,
          recvNetwork: false,
          giveBusiness: false,
          recvBusiness: false
        }, saved[mate] || {});
        row[fieldName] = Boolean(event.target.checked);
        if (!(row.giveNetwork || row.recvNetwork || row.giveBusiness || row.recvBusiness)) delete saved[mate];
        else saved[mate] = row;
        saveRoundFeedback(name, roundIndex, saved);
        showFeedbackQr = false;
        return;
      }
      if (event.target.dataset.leaderRound !== undefined) {
        const plan = loadPlan();
        if (!plan) return;
        const roundIndex = Number(event.target.dataset.leaderRound);
        const groupIndex = Number(event.target.dataset.leaderGroup);
        leadersOf(plan, loadRoster());
        if (!plan.leaders[roundIndex]) return;
        plan.leaders[roundIndex][groupIndex] = event.target.value;
        plan.leaderManual = true;
        Match.syncLeaders(plan);
        savePlan(plan);
        const leader = plan.cards[event.target.value];
        statusMessage = `第 ${roundIndex + 1} 輪第 ${groupIndex + 1} 組的組長改成${leader ? leader.name : ""}。`;
        render();
      }
    });

    document.querySelector("#app").addEventListener("input", function (event) {
      if (event.target.id !== "chapter-filter") return;
      const query = event.target.value.trim();
      document.querySelectorAll("[data-chapter]").forEach(function (row) {
        row.hidden = Boolean(query) && !row.dataset.chapter.includes(query);
      });
    });

    document.querySelector("#app").addEventListener("submit", function (event) {
      event.preventDefault();
      const form = event.target;
      const action = form.dataset.action;
      const data = new FormData(form);
      if (action === "save-member") {
        const name = take(data, "name", 20);
        const chain = pickedChains(data);
        const chapter = knownChapter(data.get("chapter"));
        if (!name) { statusMessage = "請填姓名"; render(); return; }
        if (!chapter) { statusMessage = "請選擇分會"; render(); return; }
        if (!chain) { statusMessage = "請至少選一個產業鏈"; render(); return; }
        const me = {
          name: name,
          company: take(data, "company", 40),
          industry: take(data, "industry", 20),
          chain: chain,
          chapter: chapter,
          role: take(data, "role", 12),
          have: take(data, "have", 120),
          want: take(data, "want", 120)
        };
        localStorage.setItem(STORE.me, JSON.stringify(me));
        statusMessage = "資料碼好了，請給主持掃描。";
        render();
        return;
      }
      if (action === "save-edit") {
        const roster = loadRoster();
        const name = take(data, "name", 20);
        const chain = pickedChains(data);
        const chapter = knownChapter(data.get("chapter"));
        if (!name) { statusMessage = "請填姓名"; render(); return; }
        if (!chapter) { statusMessage = "請選擇分會"; render(); return; }
        if (!chain) { statusMessage = "請至少選一個產業鏈"; render(); return; }
        if (roster.some(function (person) { return person.id !== editId && person.name === name; })) {
          statusMessage = "名單裡已經有這個姓名";
          render();
          return;
        }
        const next = roster.map(function (person) {
          if (person.id !== editId) return person;
          return {
            id: person.id,
            name: name,
            company: take(data, "company", 40),
            industry: take(data, "industry", 20),
            chain: chain,
            chapter: chapter,
            role: take(data, "role", 12),
            have: take(data, "have", 120),
            want: take(data, "want", 120)
          };
        });
        saveRoster(next);
        editId = "";
        render();
        return;
      }
      if (action === "add-manual") {
        const name = take(data, "name", 20);
        const chain = pickedChains(data);
        const chapter = knownChapter(data.get("chapter"));
        if (!name) { statusMessage = "請填姓名"; render(); return; }
        if (!chapter) { statusMessage = "請選擇分會"; render(); return; }
        if (!chain) { statusMessage = "請至少選一個產業鏈"; render(); return; }
        const result = upsert({
          name: name,
          company: take(data, "company", 40),
          industry: take(data, "industry", 20),
          chain: chain,
          chapter: chapter,
          role: take(data, "role", 12),
          have: take(data, "have", 120),
          want: take(data, "want", 120)
        });
        statusMessage = result.updated ? "已更新" + name : "已加入" + name;
        showManual = false;
        render();
        return;
      }
      if (action === "paste-code") {
        try {
          const parsed = payloadFromInput(data.get("code"));
          if (parsed.kind === "f") {
            const report = Match.decodeFeedback(parsed.payload);
            const result = ingestHostFeedback(report);
            statusMessage = `已收下${result.reporter}的回饋，新增 ${result.added} 筆`;
            showPaste = false;
            hostPanel = "stats";
          } else {
            const profile = Match.decodeProfile(parsed.payload);
            const result = upsert(profile);
            statusMessage = result.updated ? "已更新" + result.row.name : "已收下" + result.row.name;
            showPaste = false;
          }
        } catch (error) {
          statusMessage = error.message || "無法收下這段內容";
        }
        render();
        return;
      }
      if (action === "add-chapter") {
        const roster = loadRoster();
        let added = 0;
        form.querySelectorAll("input[name='m']:checked").forEach(function (input) {
          const row = CHAPTER[Number(input.value)];
          if (!row || roster.some(function (person) { return person.name === row[0]; })) return;
          roster.unshift({
            id: newId(roster),
            name: row[0],
            company: row[1],
            industry: row[2],
            chain: "",
            chapter: "大芯",
            have: row[3],
            want: ""
          });
          added += 1;
        });
        saveRoster(roster);
        statusMessage = added ? "已加入 " + added + " 人。想要的資源仍可請本人補。" : "沒有新的人被加入";
        render();
        return;
      }
      if (action === "add-feedback") {
        const giver = take(data, "giver", 20);
        const receiver = take(data, "receiver", 20);
        const round = Number(data.get("round"));
        const network = data.get("network") === "1";
        const business = data.get("business") === "1";
        if (!giver || !receiver) { statusMessage = "請選提供者和對象"; render(); return; }
        if (giver === receiver) { statusMessage = "提供者和對象不能是同一人"; render(); return; }
        if (!Number.isInteger(round) || round < 1) { statusMessage = "請選輪次"; render(); return; }
        if (!network && !business) { statusMessage = "請至少勾人脈或商機"; render(); return; }
        const current = loadHostFeedback();
        const incoming = [];
        if (network) incoming.push({ round: round, giver: giver, receiver: receiver, kind: "network" });
        if (business) incoming.push({ round: round, giver: giver, receiver: receiver, kind: "business" });
        const merged = Match.mergeFeedbackEdges(current.edges, incoming);
        saveHostFeedback({ edges: merged, reporters: current.reporters });
        statusMessage = merged.length === current.edges.length ? "這筆引薦已經在統計裡" : "已補上引薦紀錄";
        hostPanel = "stats";
        render();
        return;
      }
      if (action === "match") {
        const roster = loadRoster();
        const plan = loadPlan();
        const fresh = !plan || plan.fingerprint !== fingerprint(roster);
        if (!fresh && !pendingMatch) {
          draftSettings = readSettings();
          pendingMatch = true;
          render();
          return;
        }
        pendingMatch = false;
        draftSettings = null;
        runMatch();
      }
    });

    window.addEventListener("hashchange", render);
    window.addEventListener("storage", function (event) {
      if (!location.hash.startsWith("#host")) return;
      if (event.key !== STORE.roster && event.key !== STORE.plan && event.key !== STORE.hostFeedback) return;
      if (document.querySelector("#app input:focus, #app textarea:focus")) {
        statusMessage = "有新的資料。完成輸入後會出現在名單。";
        return;
      }
      render();
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible" || !location.hash.startsWith("#host")) return;
      if (editId || document.querySelector("#app input:focus, #app textarea:focus")) return;
      render();
    });
    render();
  </script>
</body>
</html>
