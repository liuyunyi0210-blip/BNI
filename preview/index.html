<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大芯分會 · 會員與合作機會</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f1ec;
      --paper: #fff;
      --ink: #1a1814;
      --muted: #6f675f;
      --line: #e7e1d8;
      --accent: #7a2e2e;
      --shadow: 0 1px 2px rgba(26, 24, 20, 0.04), 0 10px 28px rgba(26, 24, 20, 0.05);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    header, .toolbar, main, footer {
      max-width: 1160px;
      margin: 0 auto;
      padding-left: 28px;
      padding-right: 28px;
    }
    header {
      padding-top: 32px;
      padding-bottom: 4px;
    }
    .title-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      align-items: center;
      justify-content: space-between;
    }
    .mark {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--accent);
    }
    h1 { margin: 2px 0 0; font-size: 32px; font-weight: 650; letter-spacing: 0.02em; }
    nav {
      display: flex;
      gap: 2px;
      padding: 4px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    nav button, .filters button, .card, .text-btn, .close, select {
      font: inherit;
      cursor: pointer;
    }
    nav button {
      border: 0;
      background: transparent;
      border-radius: 999px;
      padding: 7px 14px;
      color: var(--muted);
    }
    nav button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    .sub { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .toolbar {
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .toolbar[hidden] { display: none; }
    .toolbar label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(360px, 100%);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    input[type="search"], select {
      height: 42px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 10px;
      padding: 0 14px;
      font: inherit;
      color: inherit;
      box-shadow: 0 1px 0 rgba(26, 24, 20, 0.02);
    }
    input[type="search"] { width: min(520px, 100%); }
    input:focus, button:focus-visible, .card:focus-visible, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filters button {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .filters button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    main { padding-top: 12px; padding-bottom: 56px; }
    .group { margin-top: 28px; }
    .group h2, .block h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .group h2::after, .block h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card, .panel {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .card {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 2px 14px;
      align-items: start;
      padding: 16px;
      border-top: 2px solid var(--swatch, var(--accent));
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(26, 24, 20, 0.08);
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--swatch, var(--accent));
      color: #fff;
      font-weight: 650;
      font-size: 20px;
      box-shadow: 0 0 0 3px #fff, 0 0 0 4px color-mix(in srgb, var(--swatch, var(--accent)) 35%, var(--line));
    }
    img.avatar {
      display: block;
      object-fit: cover;
      object-position: center 18%;
    }
    .fit-pill {
      grid-column: 1 / -1;
      margin: 8px 0 0;
      background: #f6f4f1;
      color: #4e4944;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 500;
    }
    .fit-k {
      margin-right: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .cat { margin: 0; font-size: 12px; color: var(--swatch, var(--accent)); font-weight: 700; letter-spacing: 0.04em; }
    .who {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-top: 12px;
    }
    .who .avatar { width: 96px; height: 96px; font-size: 28px; }
    .lcd {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .tile { border-radius: 10px; padding: 10px 12px; min-height: 100%; }
    .tile .k { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .tile p { margin: 0; font-size: 14px; }
    .tile.customer { background: #f3eef8; }
    .tile.customer .k { color: #6a4c93; }
    .tile.product { background: #eef3f8; }
    .tile.product .k { color: #2c5f8a; }
    .tile.fn { background: #eef6f1; }
    .tile.fn .k { color: #2f7d55; }
    .fit-band {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f7f1ea;
    }
    .fit-band .k { margin: 0 0 4px; font-size: 12px; font-weight: 700; color: #8c3d4a; }
    .qa {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .qa div { border-radius: 10px; padding: 10px 12px; }
    .qa .k { margin: 0 0 4px; font-size: 12px; font-weight: 700; }
    .qa p { margin: 0; font-size: 14px; }
    .qa .open { background: #f6f4f0; }
    .qa .bad { background: #f8eeee; }
    .qa .myth { background: #f3f1ea; }
    .scale {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .qa + .scale { margin-top: 12px; }
    .step { border-radius: 10px; padding: 10px; min-height: 100%; }
    .step .k { margin: 0 0 6px; font-size: 12px; font-weight: 700; }
    .step .k:last-child { margin-bottom: 0; }
    .step p { margin: 0; font-size: 13px; }
    .step.s0 { background: #e7f2ea; }
    .step.s1 { background: #eef3f8; }
    .step.s2 { background: #f7f1ea; }
    .step.s3 { background: #f8eeee; }
    .pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .mini {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .bridge {
      width: 72px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--swatch, var(--accent));
    }
    .bridge span {
      display: block;
      margin-top: 4px;
      height: 2px;
      background: var(--swatch, var(--accent));
    }
    .card h3, .opp h3 { margin: 2px 0 0; font-size: 18px; font-weight: 650; letter-spacing: 0.02em; }
    .en, .company, .summary, .empty, .meta { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .company { color: #3f3a35; }
    .slogan,
    .slogan-line {
      margin: 12px 0 0;
      padding: 8px 12px;
      border-left: 2px solid var(--swatch, var(--accent));
      border-radius: 0 8px 8px 0;
      background: color-mix(in srgb, var(--swatch, var(--accent)) 8%, #fff);
      color: var(--ink);
      font-family: "Songti TC", "Noto Serif TC", "PMingLiU", serif;
      font-weight: 600;
      line-height: 1.6;
    }
    .slogan {
      grid-column: 1 / -1;
      font-size: 14px;
    }
    .slogan-line {
      width: fit-content;
      max-width: 100%;
      font-size: 22px;
      line-height: 1.5;
      padding: 14px 18px;
    }
    .empty { padding: 28px 0; }
    .text-btn {
      border: 0;
      background: transparent;
      color: var(--accent);
      padding: 0;
      font-size: 14px;
    }
    .person-head { margin-top: 4px; }
    .person-head h2 {
      margin: 4px 0 0;
      font-size: 32px;
      letter-spacing: 0.02em;
      color: var(--ink);
      font-weight: 650;
    }
    .layout {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 16px;
      margin-top: 20px;
    }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .panel { padding: 18px 18px 16px; }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }
    .panel h3 { margin: 16px 0 6px; font-size: 15px; }
    .panel p { margin: 0 0 8px; }
    .panel p:last-child { margin-bottom: 0; }
    .service + .service { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    ul { margin: 0; padding-left: 1.1em; }
    li { margin: 4px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .tag {
      display: inline-block;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 8px;
      color: var(--muted);
    }
    .opp { padding: 16px; }
    .opp .basis { margin-top: 8px; }
    .learn { display: flex; flex-direction: column; gap: 16px; }
    .learn h2 {
      margin: 18px 0 8px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0;
      color: var(--ink);
    }
    .learn section { scroll-margin-top: 12px; }
    .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .lead { margin: 0 0 8px; font-size: 20px; line-height: 1.55; font-weight: 650; }
    .stages {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .stage { border-radius: 10px; padding: 10px 12px; background: #f6f4f0; min-height: 100%; }
    .stage .k { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--accent); }
    .stage p { margin: 0; font-size: 13px; }
    .steps-col { display: flex; flex-direction: column; gap: 8px; }
    .pair-note { border-radius: 10px; padding: 10px 12px; }
    .pair-note .k { margin: 0 0 4px; font-size: 12px; font-weight: 700; }
    .pair-note.bad { background: #f8eeee; }
    .pair-note.open { background: #f6f4f0; }
    .two, .three { display: grid; gap: 12px; }
    .two { grid-template-columns: 1fr 1fr; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .marks { list-style: none; padding: 0; margin: 0; }
    .marks li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .marks li:last-child { border-bottom: 0; padding-bottom: 0; }
    .num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f6f1eb;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    .marks li.hot .num { background: var(--accent); color: #fff; }
    .callout {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f7f1ea;
    }
    .role { border-top: 3px solid var(--swatch, var(--line)); }
    .role .ex {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f6f4f0;
      font-size: 14px;
    }
    .formula {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .formula span, .formula b {
      border-radius: 8px;
      padding: 8px 12px;
      background: #f6f4f0;
      font-size: 15px;
      font-weight: 650;
    }
    .formula b { background: var(--ink); color: #fff; }
    .formula i { font-style: normal; color: var(--muted); font-weight: 700; }
    .ladder {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      align-items: center;
      margin-top: 4px;
    }
    .ladder b {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .ladder i { font-style: normal; color: var(--muted); }
    footer {
      margin-top: 8px;
      padding-top: 16px;
      padding-bottom: 36px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    @media (max-width: 800px) {
      header, .toolbar, main, footer { padding-left: 16px; padding-right: 16px; }
      h1, .person-head h2 { font-size: 28px; }
      .slogan-line { font-size: 18px; }
      .layout, .lcd, .scale, .pair, .stages, .two, .three { grid-template-columns: 1fr; }
      .bridge span { width: 2px; height: 18px; margin: 4px auto 0; }
      .lead { font-size: 18px; }
      .card:hover { transform: none; }
    }
  </style>
</head>

  <main id="main"></main>

    function opportunitiesFor(viewer) {
      return matches.map((match) => {
        const left = members.find((person) => person.name === match.from);
        const right = members.find((person) => {
          if (match.toName) return person.name === match.toName;
          return person.category.includes(match.categoryIncludes) && person.name !== match.from;
        });
        if (!left || !right) return null;
        if (viewer.id !== left.id && viewer.id !== right.id) return null;
        return { ...match, left, right };
      }).filter(Boolean);
    }

        if (group !== "all" && person.group !== group) return false;
        if (!keyword) return true;
        return [person.name, person.en, person.company, person.category, person.summary, person.slogan]
          .join(" ").toLowerCase().includes(keyword.toLowerCase());
      });
      const seats = members.filter((person) => person.group !== "role").length;
      count.textContent = `顯示 ${people.length} 人 · 介紹冊上有 ${seats} 個行業席次`;
      foot.textContent = "名單來自 2026/03/09 會員介紹，照片來自 2026/09/09 會員型錄。劉柏儀與劉昀易的適合對象依他們的一對一表，其他人是生成草稿。";
      const html = groups.map((item) => {
        const rows = people.filter((person) => person.group === item.id);
        if (!rows.length) return "";
        return `<section class="group"><h2>${item.label}</h2><div class="grid">${rows.map(card).join("")}</div></section>`;
      }).join("");
      main.innerHTML = html || `<p class="empty">沒有符合的會員。</p>`;
      const input = document.querySelector("#q");
      input.addEventListener("input", () => { keyword = input.value.trim(); render(); document.querySelector("#q").focus(); });
      document.querySelector("#filters").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        group = button.dataset.group;
        render();
      });
    }

    const profiles = { "劉柏儀": boyd, "劉昀易": will };
    const formPacks = { "劉柏儀": boydPack, "劉昀易": willPack };

    function packOf(person) {
      return formPacks[person.name] || packs[person.name] || null;
    }

    function lcdHtml(pack) {
      const note = pack.note || (pack.source === "form"
        ? "依一對一五表整理。三格從左到右是客戶、產品、功能。"
        : "生成草稿，不是本人填的五表。三格從左到右是客戶、產品、功能。");
      return `<p class="meta">${note}</p>` + pack.items.map((service) => `<div class="service">
        <p><strong>${service.name}</strong></p>
        <div class="lcd">
          <article class="tile customer"><p class="k">客戶屬性</p><p>${service.customer}</p></article>
          <article class="tile product"><p class="k">產品屬性</p><p>${service.product}</p></article>
          <article class="tile fn"><p class="k">功能屬性</p><p>${service.fn}</p></article>
        </div>
        <div class="fit-band"><p class="k">預期適合的對象</p><p>${service.fit}</p></div>
        <div class="qa">
          <div class="open"><p class="k">可以這樣開口</p><p>${service.open}</p></div>
          <div class="bad"><p class="k">不適合的引薦</p><p>${service.notFit}</p></div>
          <div class="myth"><p class="k">誤解與應對</p><p>${service.myth}</p></div>
        </div>
        ${service.standards ? `<div class="scale">${service.standards.map((item, index) => `<article class="step s${index}"><p class="k">${item[0]}</p><p>${item[1]}</p></article>`).join("")}</div>` : ""}
      </div>`).join("");
    }

    function avatarHtml(person) {
      if (!person.photo) return `<span class="avatar" aria-hidden="true">${person.name.slice(0, 1)}</span>`;
      return `<img class="avatar" src="photos/${person.photo}" alt="">`;
    }

    function card(person) {
      const pack = packOf(person);
      const fit = pack ? pack.items[0].fitShort : "";
      const slogan = person.slogan ? `<p class="slogan">${person.slogan}</p>` : "";
      const extra = fit
        ? `<p class="fit-pill"><span class="fit-k">適合</span>${fit}</p>`
        : (person.slogan ? "" : `<p class="summary" style="grid-column:1/-1">${person.summary}</p>`);
      return `<button class="card" type="button" data-id="${person.id}" style="--swatch:${person.color}">
        ${avatarHtml(person)}
        <div>
          <p class="cat">${person.category}</p>
          <h3>${person.name}</h3>
          ${person.en ? `<p class="en">${person.en}</p>` : ""}
          ${person.company ? `<p class="company">${person.company}</p>` : ""}
        </div>
        ${slogan}
        ${extra}
      </button>`;
    }

    function renderPerson() {
      const person = personById(personId);
      const profile = profiles[person.name];
      toolbar.hidden = true;
      count.textContent = person.category;
      foot.textContent = profile
        ? "服務說明依一對一表整理。客戶不顯示姓名、路名與精確金額。家庭、秘密與深切願望沒有放上來。"
        : "服務項目是生成草稿。引薦標準、人脈圈與實際客戶，仍等本人的五表。";
      main.innerHTML = profile ? formPage(person, profile, packOf(person)) : basicPage(person);
    }

    function basicPage(person) {
      return `      <div class="person-head" style="--swatch:${person.color}">
        <button class="text-btn" type="button" data-back>回到名單</button>
        <div class="who">
          ${avatarHtml(person)}
          <div>
            <h2>${person.name}</h2>
            ${person.en ? `<p class="en">${person.en}</p>` : ""}
            ${person.company ? `<p class="company">${person.company}</p>` : ""}
          </div>
        </div>
        ${person.slogan ? `<p class="slogan-line">${person.slogan}</p>` : ""}
      </div>
      <div class="layout">
        <section class="panel">
          <h2>服務項目與適合對象</h2>
          ${packOf(person) ? lcdHtml(packOf(person)) : "<p>這是分會角色，沒有另做可引薦的服務項目。</p>"}
        </section>
        <section class="panel">
          <h2>還沒登錄的五表</h2>
          <p>上面是依介紹冊生成的說明。引薦標準、人脈圈與實際客戶，要等本人的五表放進來，才拿去配對。</p>
        </section>
      </div>`;
    }

    function clientSection(profile) {
      if (profile.clientBlocks) {
        return profile.clientBlocks.map((block) => `<h3>${block.title}</h3>
          <p class="meta">${block.note}</p>
          <table>
            <thead><tr>${block.columns.map((cell) => `<th>${cell}</th>`).join("")}</tr></thead>
            <tbody>${block.rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>`).join("");
      }
      return `<p class="meta">分會看得到類型。姓名、路名與精確金額沒有放進來。</p>
        <table>
          <thead><tr><th>案型</th><th>地區</th><th>金額區間</th><th>做了什麼</th></tr></thead>
          <tbody>${profile.clients.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
        <p style="margin-top:10px">${profile.clientTypes.map((item) => `<span class="tag">${item}</span>`).join(" ")}</p>`;
    }

    function formPage(person, profile, pack) {
      const sphereHeaders = profile.sphereHeaders || ["行業", "前三名", "我能提供什麼"];
      return `      <div class="person-head" style="--swatch:${person.color}">
        <button class="text-btn" type="button" data-back>回到名單</button>
        <div class="who">
          ${avatarHtml(person)}
          <div>
            <p class="cat">席次 · ${person.category}</p>
            <h2>${person.name}</h2>
            <p class="en">${person.en} · ${person.company} · ${profile.roleTitle}</p>
            <p class="meta">行業年資 ${profile.years} · ${profile.areaLabel || "服務地區"} ${profile.area}</p>
            ${profile.areaNote ? `<p class="meta">${profile.areaNote}</p>` : ""}
          </div>
        </div>
        ${person.slogan ? `<p class="slogan-line">${person.slogan}</p>` : ""}
      </div>
      <div class="layout">
        <div class="stack">
          <section class="panel">
            <h2>服務項目與適合對象</h2>
            ${lcdHtml(pack)}
          </section>
          ${profile.standards ? `<section class="panel">
            <h2>引薦標準</h2>
            <div class="scale">${profile.standards.map((item, index) => `<article class="step s${index}"><p class="k">${item[0]}</p><p>${item[1]}</p></article>`).join("")}</div>
            ${profile.prefer ? `<p>偏好：${profile.prefer}</p>` : ""}
            ${profile.avoidStyle ? `<p>不愛：${profile.avoidStyle}</p>` : ""}
          </section>` : ""}
          <section class="panel">
            <h2>現有客戶</h2>
            ${clientSection(profile)}
          </section>
        </div>
        <div class="stack">
          <section class="panel">
            <h2>事業目標</h2>
            <ul>${profile.goals.map((item) => `<li><strong>${item[0]}。</strong>${item[1]}</li>`).join("")}</ul>
          </section>
          <section class="panel">
            <h2>業務人脈圈</h2>
            <table>
              <thead><tr>${sphereHeaders.map((cell) => `<th>${cell}</th>`).join("")}</tr></thead>
              <tbody>${profile.sphere.map((row) => `<tr><td>${row[1] === "是" ? "<strong>" + row[0] + "</strong>" : row[0]}</td><td>${row[1] === "是" ? "前三名" : "—"}</td><td>${row[2]}<div class="meta">${row[3]}</div></td></tr>`).join("")}</tbody>
            </table>
          </section>
          <section class="panel">
            <h2>已經在合作的行業</h2>
            <p>${profile.partners.map((item) => `<span class="tag">${item}</span>`).join(" ")}</p>
            <p class="meta">${profile.partnersNote || "這些是現有合作端，用來避免重複介紹同一種廠商。"}</p>
          </section>
          <section class="panel">
            <h2>成就</h2>
            <ul>${profile.wins.map((item) => `<li>${item}</li>`).join("")}</ul>
            ${profile.skills ? `<p class="meta">技能：${profile.skills}</p>` : ""}
            <p class="meta">${profile.interests}</p>
          </section>
          ${profile.networks ? `<section class="panel">
            <h2>人際網路</h2>
            <ul>${profile.networks.map((item) => `<li>${item}</li>`).join("")}</ul>
            <p class="meta">這些是他認識的行業，不拿來配對。</p>
          </section>` : ""}
        </div>
      </div>`;
    }

    function renderOpportunities() {
      toolbar.hidden = false;
      const viewer = personById(viewerId);
      toolbar.innerHTML = `<label>以誰的角度看
        <select id="viewer" aria-label="以誰的角度看合作機會">
          ${members.filter((person) => person.group !== "role").map((person) =>
            `<option value="${person.id}" ${person.id === viewerId ? "selected" : ""}>${person.name} · ${person.category}</option>`
          ).join("")}
        </select>
      </label>`;
      const rows = opportunitiesFor(viewer);
      count.textContent = `${viewer.name} 看得到 ${rows.length} 筆合作機會`;
      foot.textContent = "機會只在雙方之間顯示。目前用劉柏儀與劉昀易的一對一表對上其他會員的席次，沒有把整份客戶名單送去分析。";
      main.innerHTML = rows.length
        ? `<div class="stack">${rows.map(opportunityCard).join("")}</div>`
        : `<p class="empty">${viewer.name} 目前沒有對得上的機會。已登錄一對一表的是劉柏儀與劉昀易，其他會員還不能配對。</p>`;
      document.querySelector("#viewer").addEventListener("change", (event) => {
        viewerId = Number(event.target.value);
        render();
      });
    }

    function mini(person) {
      return `<div class="mini" style="--swatch:${person.color}">
        ${avatarHtml(person)}
        <div>
          <strong>${person.name}</strong>
          <p class="meta">${person.category}</p>
        </div>
      </div>`;
    }

    function opportunityCard(item) {
      return `<article class="panel opp" style="--swatch:${item.right.color}">
        <div class="pair">
          ${mini(item.left)}
          <div class="bridge">${item.type}<span></span></div>
          ${mini(item.right)}
        </div>
        <div class="qa">
          <div class="open"><p class="k">依據</p><p>${item.basis}</p></div>
          <div class="open"><p class="k">可以這樣開口</p><p>${item.talk}</p></div>
          <div class="bad"><p class="k">請不要這樣介紹</p><p>${item.avoid}</p></div>
        </div>
        <p style="margin-top:10px"><button class="text-btn" type="button" data-id="${item.left.id}">看${item.left.name}</button>
        · <button class="text-btn" type="button" data-id="${item.right.id}">看${item.right.name}</button></p>
      </article>`;
    }

    tabList.addEventListener("click", () => { view = "list"; render(); });
    tabOpp.addEventListener("click", () => { view = "opportunities"; render(); });
    tabLearn.addEventListener("click", () => { view = "learn"; render(); });
    main.addEventListener("click", (event) => {
      const back = event.target.closest("[data-back]");
      if (back) { view = "list"; render(); return; }
      const button = event.target.closest("[data-id]");
      if (!button || view === "opportunities" && event.target.closest("select")) return;
      if (button.dataset.id) {
        personId = Number(button.dataset.id);
        view = "person";
        render();
      }
    });

    render();
  </script>
</body>
</html>
